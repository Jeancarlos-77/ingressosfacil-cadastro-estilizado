        .layout {
            min-height: 100vh;
            min-height: 100svh;
            max-width: 1240px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 430px);
            gap: clamp(32px, 7vw, 106px);
            align-items: center;
            padding: clamp(30px, 6vw, 82px) clamp(22px, 5vw, 72px);
        }

        .intro { align-self: center; }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--ink);
            font: 700 1.12rem "Zalando Sans Expanded", sans-serif;
            margin-bottom: clamp(36px, 8vh, 85px);
        }
        .ticket {
            display: grid;
            place-items: center;
            width: 42px;
            height: 34px;
            border: 1px solid #92fbe89c;
            border-radius: 7px;
            background: #11233bd4;
            box-shadow: 0 0 24px #61f7ec3b;
            color: var(--mint);
            transform: rotate(-10deg);
        }
        .ticket::after { content: ""; height: 18px; border-left: 2px dotted currentColor; }
        .hero-title {
            margin: 0 0 20px;
            max-width: 9ch;
            font: 500 clamp(2rem, 5vw, 4.45rem)/.98 "Zalando Sans Expanded", sans-serif;
            letter-spacing: -.065em;
            text-transform: uppercase;
            text-shadow: 0 4px 30px #0b0616b0;
        }
        .hero-title span { display: block; color: var(--mint); text-shadow: 0 0 24px #087edea8, 0 3px 16px #09051e; }
        .intro p {
            max-width: 31ch;
            margin: 0;
            color: #eee5f5;
            font-size: clamp(1rem, 1.7vw, 1.18rem);
            text-shadow: 0 2px 12px #0b0616;
        }

        .glass {
            position: relative;
            border: 1px solid #dceaff52;
            border-radius: clamp(28px, 4vw,  40px);
            background: #171b32;
            background:
                radial-gradient(ellipse at 0% 0%, #a6efff24, transparent 58%),
                radial-gradient(ellipse at 100% 100%, #9067f524, transparent 62%),
                linear-gradient(155deg, #2d3654, #14192e 62%, #20203d);
            box-shadow:
                0 24px 72px #04051280,
                inset 0 1px 0 #ffffff29;
        }
        @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .glass {
                background:
                    radial-gradient(ellipse at 0% 0%, #9edeff28, transparent 58%),
                    radial-gradient(ellipse at 100% 100%, #9067f534, transparent 62%),
                    linear-gradient(152deg, #252c47a6, #11182bc4 62%, #1d1c37a8);
                -webkit-backdrop-filter: blur(24px) saturate(142%);
                backdrop-filter: blur(24px) saturate(142%);
            }
        }
        .glass .card-body {
            padding: clamp(23px, 3.7vw, 37px);
        }
        .glass h2 {
            margin: 0 0 25px;
            font: 600 clamp(1.55rem, 3vw, 2.15rem)/1.13 "Zalando Sans Expanded", sans-serif;
            letter-spacing: -.04em;
        }
        .glass .form-label {
            margin-bottom: 6px;
            color: #f4f5ff;
            font-size: .95rem;
            font-weight: 600;
        }
        .glass .form-control,
        .glass .form-select {
            min-height: 48px;
            border: 1px solid #d5e5ff46;
            border-radius: 15px;
            background-color: #94b7ea17;
            box-shadow: inset 0 1px 0 #ffffff0e, 0 3px 12px #070b281c;
            color: var(--ink);
            font-size: 1rem;
        }
        .glass .form-control {
            padding-inline: 14px;
        }
        .glass .form-control::placeholder {
            color: #ccd2e7;
            opacity: 1;
        }
        .glass .form-select {
            padding-inline-start: 14px;
        }
        .glass .form-select:invalid {
            color: #ccd2e7;
        }
        .glass .form-select option {
            background-color: #202640;
            color: var(--ink);
        }
        .glass .form-check-label {
            color: #e4e6f2;
            font-size: .95rem;
        }
        .glass .form-check-input {
            background-color: #94b7ea1f;
            border: 1px solid #d5e5ff87;
            border-radius: 5px;
        }
        .glass .form-check-input:checked {
            background-color: #6451c5;
            border-color: #c8bdff;
        }
        .glass :is(.form-control, .form-select, .form-check-input):focus {
            border-color: #8ceaff;
            outline: 2px solid #8ceaff5c;
            outline-offset: 2px;
            box-shadow: inset 0 1px 0 #ffffff1a;
        }
        .glass :is(.form-control, .form-select):focus {
            background-color: #9ac9f623;
        }
        .glass .btn-primary {
            min-height: 48px;
            border: 1px solid #d6edff9c;
            border-radius: 15px;
            color: #13112a;
            font-weight: 700;
            background: linear-gradient(110deg, #c7bdff, #a2eaff);
            box-shadow: 0 8px 20px #06091d42, inset 0 1px 0 #ffffff73;
        }
        .glass .btn-primary:hover { filter: brightness(1.07); }
        .glass .btn-primary:focus-visible { outline: 2px solid var(--mint); outline-offset: 4px; }
        .glass:focus-within {
            border-color: #9de8ff80;
        }
        .glass :is(.form-control, .form-select):focus {
            box-shadow: inset 0 1px 0 #ffffff1a, 0 0 18px #6beaff29;
        }
        .glass .btn-primary:is(:hover, :focus-visible) {
            box-shadow: 0 8px 24px #70dbff52, inset 0 1px 0 #ffffff73;
        }

        @media (prefers-reduced-motion: no-preference) {
            .glass::after {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                pointer-events: none;
                background-image: linear-gradient(
                    112deg,
                    transparent 35%,
                    #aff3ff16 46%,
                    #ddf9ff3d 50%,
                    #b6adff1c 54%,
                    transparent 65%
                );
                background-size: 240% 100%;
                background-position: right center;
                background-repeat: no-repeat;
                opacity: 0;
                animation: reflexo-vidro 1.35s ease-out .18s both;
            }
            .glass {
                transition: border-color .2s ease;
            }
            .glass :is(.form-control, .form-select, .btn-primary) {
                transition: background-color .2s ease, border-color .2s ease,
                    box-shadow .2s ease, filter .2s ease;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .glass :is(.form-control, .form-select, .form-check-input, .btn-primary) {
                transition: none;
            }
        }
        @keyframes reflexo-vidro {
            0% { opacity: 0; background-position: right center; }
            18%, 77% { opacity: 1; }
            100% { opacity: 0; background-position: left center; }
        }

        .glass .alert { overflow-wrap: anywhere; }
        .glass .alert-success { color: #c0ffe6; background-color: #153e33; border-color: #4ead90; }
        .glass .alert-danger { color: #ffd9e0; background-color: #461d30; border-color: #b7657a; }
        @media (max-width: 767px) {
            body { background-position: 30% center; }
            .layout { grid-template-columns: minmax(0, 470px); justify-content: center; gap: 28px; }
            .brand { margin-bottom: 24px; }
            .hero-title { max-width: 13ch; margin-bottom: 12px; }
        }
    </style>
</head>
<body data-bs-theme="dark">
    <main class="container layout">
        <section class="intro" aria-labelledby="titulo">
            <div class="brand"><span class="ticket" aria-hidden="true"></span>IngressosFácil</div>
            <h1 id="titulo" class="hero-title">A noite <span>começa aqui.</span></h1>
            <p>Crie sua conta e escolha os eventos que você quer acompanhar.</p>
        </section>

        <section class="card glass" aria-labelledby="titulo-cadastro">
            <div class="card-body">
                <h2 id="titulo-cadastro">Criar conta</h2>

                <div id="alerta-cadastro" class="alert" role="alert" hidden></div>

                <form id="form-cadastro">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome completo</label>
                        <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu nome" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="voce@exemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha" placeholder="Mínimo de 8 caracteres" minlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label for="categoria" class="form-label">Categoria preferida</label>
                        <select class="form-select" id="categoria" name="categoria" required>
                            <option value="">Selecione...</option>
                            <option value="show">Shows</option>
                            <option value="comedia">Comédia</option>
                            <option value="esporte">Esportes</option>
                            <option value="gastronomia">Gastronomia</option>
                        </select>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="termos" name="termos" required>
                        <label class="form-check-label" for="termos">Li e aceito os termos de uso</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                </form>
            </div>
        </section>
    </main>

    <script>
        // ===== Elementos da página =====
        const formCadastro = document.getElementById("form-cadastro");
        const nome = document.getElementById("nome");
        const email = document.getElementById("email");
        const senha = document.getElementById("senha");
        const categoria = document.getElementById("categoria");
        const termos = document.getElementById("termos");
        const alertaCadastro = document.getElementById("alerta-cadastro");

        // ===== Função que mostra o alerta =====
        function mostrarAlerta(texto, tipo) {
            alertaCadastro.textContent = texto;                 // escreve a mensagem
            alertaCadastro.className = "alert alert-" + tipo;   // troca as classes: define a cor
            alertaCadastro.hidden = false;                      // mostra o alerta
        }

        // ===== Envio do formulário =====
        formCadastro.addEventListener("submit", function (event) {
            event.preventDefault();

            const usuario = {
                nome: nome.value.trim(),
                email: email.value.trim().toLowerCase(),
                senha: senha.value,
                categoria: categoria.value,
                aceitouTermos: termos.checked
            };

            const nomeCategoria = categoria.selectedOptions[0].textContent;

            mostrarAlerta(
                `Cadastro realizado, ${usuario.nome}! E-mail: ${usuario.email}. Categoria preferida: ${nomeCategoria}.`,
                "success"
            );

            formCadastro.reset();
        });
    </script>
</body>
</html>
